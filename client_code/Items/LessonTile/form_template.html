<a class="sb-tile" href="#home">
  <span class="sb-tile-n" anvil:name="num_box"><anvil-component type="Label" name="num" bind:text="str(self.item['n'])"></anvil-component></span>
  <span class="sb-tile-body">
    <anvil-component type="Label" name="title" prop:role='["sb-tile-title"]'></anvil-component>
    <anvil-component type="Label" name="status" prop:role='["sb-tile-status"]'></anvil-component>
  </span>
  <i class="ic sb-tile-ic" anvil:name="icon"></i>
  <span class="sb-tile-bar" anvil:name="bar"><i anvil:name="bar_fill"></i></span>
</a>
