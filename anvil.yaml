    <noscript><div class="seo-noscript">
    <h1>Spoken Miles: learn Spanish, French or Italian in your car</h1>
    <p>45-minute hands-free audio lessons for the car: hear English, say it in Spanish, French or Italian. Lifetime access, works offline. Lesson 1 free.</p>
    <p>Spoken Miles is a set of audio language courses built for the car. Every lesson is exactly 45 minutes: you hear a phrase in English, a pause gives you time to say it out loud in the new language, and then you hear the answer. New phrases come back at growing intervals, the spaced-recall method published by the linguist Paul Pimsleur, so they stick without a screen or homework. Unlike tap-and-streak apps, every lesson is spoken: 250 to 320 phrases come out of your own mouth each time.</p>
    <p>Courses: Spanish, French and Italian for English speakers, and English for Spanish speakers. Five levels of 30 lessons go from first greetings to regional culture and friendly debate: 150 lessons and about 3,000 phrases per language, each lesson with a real-life situation, a feeling to express and a culture moment. Pay once for lifetime access; stream the lessons, save a pack, a level or the whole course on your phone for drives with no signal, or download the MP3s. Courses can be given as a gift with a printable card.</p>
    <p>Who it's for: Adults who drive (commuters, parents on the school run, road-trippers) and want to actually speak Spanish, French or Italian, plus people looking for a gift for a parent who has always wanted to learn</p>
    <h2>What it does</h2><ul><li>Spanish, French and Italian for English speakers; English for Spanish speakers</li><li>150 lessons of exactly 45 minutes per language, in five levels</li><li>Hear it in English, say it out loud, then hear the answer</li><li>Spaced recall: every phrase returns just before you would forget it</li><li>Made for the car: car mode with one big button, lock-screen and car-display controls</li><li>Trip length: stop at 15 or 30 minutes and pick up there next drive</li><li>Works offline: save 5 lessons, a level or the whole course on your phone</li><li>Pay once, lifetime access; MP3 downloads for CarPlay or a USB stick</li><li>Give it as a gift: a card to print or a link to send</li><li>Lesson 1 free with an account</li></ul>
    <h2>Questions</h2><h3>How is this different from Duolingo?</h3><p>Duolingo is great for vocabulary and a daily habit, but most of the time you read and tap. Spoken Miles is all speaking: hundreds of phrases out loud in every lesson, timed so they move into long-term memory.</p><h3>Is it safe to use while driving?</h3><p>It is audio only and never asks you to look at anything. Speaking out loud is like talking to a passenger. Keep your attention on the road and pause when traffic needs you.</p><h3>Does it work without a signal?</h3><p>Yes. Save lessons on your phone (a pack of five, a level or the whole course, about 3.2 GB) and they play with no signal.</p><h3>Is it a subscription?</h3><p>No. You pay once and the lessons are yours for life.</p><h3>Can I give it as a gift?</h3><p>Yes. Buy it as a gift, add a name and a message, then print the card or send the link.</p><h3>Can I try it first?</h3><p>Yes. Make a free account and the whole of lesson 1 is yours.</p>
    <p><a href="https://spokenmiles.com/about">About Spoken Miles</a> &middot; <a href="https://spokenmiles.com/llms.txt">Spoken Miles for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. Spoken Miles needs JavaScript in your browser.</p>
    </div></noscript>
