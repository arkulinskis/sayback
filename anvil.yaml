metadata:
  description: 'Speak Spanish (or English) on the drive you already take: 45-minute hands-free audio lessons for the car and
    the kitchen.'
  logo_img: asset:icon-512.png
  title: Sayback
name: Sayback
native_deps:
  head_html: |
    <script src="_/theme/legal-kit.js?v=b9b9209af1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef2f4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <link id="ui-favicon" rel="icon" type="image/svg+xml" href="_/theme/icon.svg?v=a97e448796">
    <link rel="apple-touch-icon" href="_/theme/icon-180.png?v=7da627485c">
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('ui-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    </script>

    <!-- Prepsto feedback panel: every "Submit feedback" link and button opens it (it is the only feedback channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="__PREPSTO_CODE__" data-button="false" data-label="Submit feedback" async></script>
    <link rel="stylesheet" href="_/theme/icons.css?v=b535f6e813">
    <link rel="stylesheet" href="_/theme/app.css?v=1f59a171b6">
    <script src="_/theme/sb-i18n.js?v=d8e41ff024"></script>
    <script src="_/theme/sb-hero-data.js?v=3a2e4a6369"></script>
    <script src="_/theme/sb-road.js?v=d98749d5f7"></script>
    <script src="_/theme/sb-player.js?v=35ff09a959"></script>
    <script src="_/theme/app-kit.js?v=d466acb25c"></script>
package_name: Sayback
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
    use_google: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/secrets.yml
startup:
  module: startup
  type: module
