    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Service", "@id": "https://sayback.anvil.app/#app", "name": "Sayback", "url": "https://sayback.anvil.app/", "description": "45-minute hands-free audio lessons for the car and the kitchen. Hear it in English, say it in Spanish, out loud. 150 lessons. Lesson 1 is free.", "image": "https://sayback.anvil.app/_/theme/og-image.png", "serviceType": "Speak a new language in the minutes you already have", "provider": {"@id": "https://arkvital.com/#org"}, "areaServed": "Worldwide", "availableChannel": {"@type": "ServiceChannel", "serviceUrl": "https://sayback.anvil.app/", "name": "Web browser", "availableLanguage": "en"}, "audience": {"@type": "Audience", "audienceType": "Busy adults who want to speak Spanish (or, in Spanish, English) and only have the commute, chores and walks to practise in"}}, {"@type": "WebSite", "@id": "https://sayback.anvil.app/#site", "url": "https://sayback.anvil.app/", "name": "Sayback", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
    <noscript><div class="seo-noscript">
    <h1>Sayback: speak Spanish on the drive you already take</h1>
    <p>45-minute hands-free audio lessons for the car and the kitchen. Hear it in English, say it in Spanish, out loud. 150 lessons. Lesson 1 is free.</p>
    <p>Sayback is a pair of audio courses built for stolen minutes: the drive to work, the dishes, the laundry, the dog walk. Every lesson is exactly 45 minutes. You hear a phrase in your own language, a pause gives you time to say it out loud in the new language, and then you hear the answer. New phrases come back at growing intervals, the spaced-recall method published by the linguist Paul Pimsleur, so they stick without any homework or screen.</p>
    <p>Sayback Spanish teaches English speakers Spanish; Sayback Inglés teaches Spanish speakers English, with the same phrases and culture notes that explain each side to the other. Five levels of 30 lessons go from first greetings to regional slang and friendly debate: 150 lessons and 3,000 phrases per course, each with a real-life situation, a feeling to express and a culture moment. Lessons play in the app (it remembers where you stopped, works from the lock screen and has a car mode with one giant button) or download as MP3s with transcripts.</p>
    <p>Who it's for: Busy adults who want to speak Spanish (or, in Spanish, English) and only have the commute, chores and walks to practise in</p>
    <h2>What it does</h2><ul><li>150 lessons of exactly 45 minutes per course, in five levels</li><li>Hear it in your language, say it out loud, then hear the answer</li><li>Spaced recall: every phrase returns just before you would forget it</li><li>A real situation, a feeling and a culture moment in every lesson</li><li>A woman&#x27;s and a man&#x27;s voice, so you hear how phrases change with the speaker</li><li>Car mode: one huge play button, lock-screen and car controls</li><li>Saved position, a weekly minutes count and a day streak</li><li>Phrase sheet for every lesson with a quiz-yourself mode</li><li>Download the MP3s and transcripts for any player or USB stick</li><li>Lesson 1 free with an account; pay once, no subscription</li></ul>
    <h2>Questions</h2><h3>Is it safe to use while driving?</h3><p>Sayback is audio only and never asks you to look at anything. Speaking out loud is like talking to a passenger. Keep your attention on the road and pause when traffic needs you.</p><h3>Which Spanish does it teach?</h3><p>Clear, neutral Spanish understood everywhere, using ustedes rather than Spain-only vosotros, with culture notes on Spain, Mexico and South America and regional flavour in Level 5.</p><h3>How long until I can have a conversation?</h3><p>By the end of Level 1, about six weeks of workday commutes, you can handle greetings, cafés, shops, directions, hotels, small talk and invitations.</p><h3>Who are the voices?</h3><p>Natural-sounding AI voices: a woman and a man for each language.</p><h3>Can I try it first?</h3><p>Yes. Make a free account and the whole of lesson 1 is yours.</p>
    <p><a href="https://sayback.anvil.app/about">About Sayback</a> &middot; <a href="https://sayback.anvil.app/llms.txt">Sayback for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. Sayback needs JavaScript in your browser.</p>
    </div></noscript>
    <!-- seo:end -->
